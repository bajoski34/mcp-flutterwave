  -
    url: "https://developersandbox-api.flutterwave.com"
    description: Dev server
security:
  -
    bearerAuth: []
paths:
  /charges:
    post:
      operationId: charges_post
      tags:
        - Charges
      summary: Create a charge
      description: Create a charge
      parameters:
        -
          $ref: "#/components/parameters/trace_id"
        -
          $ref: "#/components/parameters/idempotency_key"
        -
          $ref: "#/components/parameters/scenario_key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/charge_in"
      responses:
        201:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: "#/components/schemas/status"
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/charge"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/400"
        401:
          description: Unauthorised request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/401"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/403"
        409:
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/409"
webhooks:
  charge.completed:
    post:
      tags:
        - charge.completed
      summary: Send charge completion webhook
      operationId: charge_completed_webhook
      requestBody:
        required: true
        description: Notification about a completed charge
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/charge_completed_webhook_payload"
      responses:
        200:
          description: Return a 200 status to indicate that the webhook was received successfully
  transfer.disburse:
    post:
      tags:
        - transfer.disburse
      summary: Send disbursed transfer webhook
      operationId: transfer_disburse_webhook
      requestBody:
        required: true
        description: Notification about a disbursed transfer
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transfer_disburse_webhook_payload"
      responses:
        200:
          description: Return a 200 status to indicate that the webhook was received successfully
  transfer.reversal:
    post:
      tags:
        - transfer.reversal
      summary: Send transfer reversal webhook
      operationId: transfer_reversal_webhook
      requestBody:
        required: true
        description: Notification about a transfer reversal
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transfer_reversal_webhook_payload"
      responses:
        200:
          description: Return a 200 status to indicate that the webhook was received successfully
  order.authorization:
    post:
      tags:
        - order.authorization
      summary: Send order authorization webhook
      operationId: order_authorization_webhook
      requestBody:
        required: true
        description: Notification about an order authorization
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/order_authorization_webhook_payload"
      responses:
        200:
          description: Return a 200 status to indicate that the webhook was received successfully
  refund.completed:
    post:
      tags:
        - refund.completed
      summary: Send refund completion webhook
      operationId: refund_completed_webhook
      requestBody:
        required: true
        description: Notification about a completed refund
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/refund_completed_webhook_payload"
      responses:
        200:
          description: Return a 200 status to indicate that the webhook was received successfully
components:
  parameters:
    trace_id:
      description: A unique identifier to track this operation. It must be between 12 and 255 characters in length.
      in: header
      name: X-Trace-Id
      schema:
        type: string
        minLength: 12
        maxLength: 255
      example: acb123e4-f567-4a8b-9c0d-1e2f3a4b5c6d
    idempotency_key:
      description: A unique identifier to prevent duplicate requests. It must be between 12 and 255 characters in length.
      in: header
      name: X-Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 12
        maxLength: 255
      example: req-5c0a2e8c-f3b9-4d1a-8e2f-0c1d2e3f4a5b
    scenario_key:
      in: header
      name: X-Scenario-Key
      schema:
        type: string
        minimum: 1
        maximum: 1000
      description: "An optional scenario key that can be used to simulate specific behaviors or test different scenarios within the API. Providing this header allows you to trigger predefined responses or alter data based on the key's value, which can be useful for testing, development, or demonstrating specific functionalities. The key should be a string of 1 to 1000 characters."
      example: "scenario:auth_redirect"
  schemas:
    400:
      description: Bad Request
      type: object
      properties:
        status:
          type: string
          nullable: false
          enum:
            - failed
        error:
          type: object
          properties:
            type:
              type: string
              example: REQUEST_NOT_VALID
            code:
              type: string
              example: "10400"
            message:
              type: string
              nullable: true
              example: Request is not valid
            validation_errors:
              type: array
              items:
                type: object
                properties:
                  field_name:
                    type: string
                    example: amount
                  message:
                    type: string
                    example: must not be null
          description: The request cannot be accepted and is malformed and/or missing required parameters.
    401:
      description: Unauthorized
      type: object
      properties:
        status:
          type: string
          nullable: false
          enum:
            - failed
        message:
          type: string
          nullable: true
          description: Invalid API key provided
          example: UNAUTHORIZED
        error:
          type: object
          properties:
            type:
              type: string
              example: UNAUTHORIZED
            code:
              type: string
              example: "10401"
            message:
              type: string
              example: unauthorized
    403:
      description: Forbidden
      type: object
      properties:
        status:
          type: string
          nullable: false
          enum:
            - failed
        message:
          type: string
          description: "API key doesn't have permission to access this resource"
        error:
          type: object
          properties:
            type:
              type: string
              example: FORBIDDEN
            code:
              type: string
              example: "10403"
            message:
              type: string
              example: Forbidden
    409:
      description: Conflict
      type: object
      properties:
        status:
          type: string
          nullable: false
          enum:
            - failed
        message:
          type: string
          description: The request conflicts with another request
        error:
          type: object
          properties:
            type:
              type: string
              example: RESOURCE_CONFLICT
            code:
              type: string
              example: "10409"
            message:
              type: string
              example: Resource conflict
    status:
      type: string
      nullable: false
      enum:
        - success
        - failed
    customer_id:
      type: string
      description: ID of the customer.
      example: cus_3XarBILKQS
    address:
      type: object
      description: Customer address information.
      required:
        - line1
        - city
        - state
        - country
        - postal_code
      properties:
        city:
          type: string
          description: The name of the city.
          example: New York
          pattern: ^.+$
          x-pattern-message: value must not be empty
        country:
          description: ISO2 country code
          type: string
          pattern: "^[A-Z]{2}$"
          example: US
          x-pattern-message: must be a valid country ISO2 format
        line1:
          type: string
          description: "The first line of the Customer's address."
          example: "123 Main Street"
          pattern: ^.+$
          x-pattern-message: value must not be empty
        line2:
          type: string
          description: "The second line of the Customer's address."
          example: Apt 4B
          pattern: ^.+$
          x-pattern-message: value must not be empty
        postal_code:
          type: string
          example: "10001"
          pattern: ^.+$
          x-pattern-message: value must not be empty
        state:
          type: string
          description: The state or region.
          example: New York
          pattern: ^.+$
          x-pattern-message: value must not be empty
    email:
      type: string
      description: "The Customer's email address."
      pattern: "^[a-zA-Z0-9_+&*-]+(?:\\.[a-zA-Z0-9_+&*-]+)*@(?:[a-zA-Z0-9-]+\\.)+[a-zA-Z]{2,}$"
      example: cornelius@gmail.com
      x-pattern-message: must be an email format
    name:
      type: object
      description: "The Customer's full name."
      properties:
        first:
          type: string
          description: "The Customer's first name."
          example: King
          pattern: "^(?![ ,.'-]*$)[A-Za-z ,.'-]{2,50}$"
          x-pattern-message: "must be between 2 and 50 characters long, cannot be empty, only spaces, or only symbols, and can only contain letters, spaces, commas, periods, apostrophes, or hyphens."
        middle:
          type: string
          description: "The Customer's middle name."
          example: Leo
          pattern: "^(?![ ,.'-]*$)[A-Za-z ,.'-]{2,50}$"
          x-pattern-message: "must be between 2 and 50 characters long, cannot be empty, only spaces, or only symbols, and can only contain letters, spaces, commas, periods, apostrophes, or hyphens."
        last:
          type: string
          description: "The Customer's last name."
          example: LeBron
          pattern: "^(?![ ,.'-]*$)[A-Za-z ,.'-]{2,50}$"
          x-pattern-message: "must be between 2 and 50 characters long, cannot be empty, only spaces, or only symbols, and can only contain letters, spaces, commas, periods, apostrophes, or hyphens."
    phone:
      type: object
      description: "The customer's mobile number."
      required:
        - number
        - country_code
      example:
        country_code: "234"
        number: "08012345678"
      properties:
        country_code:
          description: The dialling country code e.g. 234 for NG.
          type: string
          pattern: "^[0-9]{1,3}$"
          example: "234"
          x-pattern-message: must be a valid 3 digit country code
        number:
          description: Unformatted 7-10-digit phone number without the country code.
          type: string
          pattern: "^[0-9]{7,10}$"
          example: "8001122334"
          x-pattern-message: must be a valid 7 to 10 digit phone number
    meta:
      type: object
      additionalProperties:
        type: string
    customer:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/customer_id"
        address:
          $ref: "#/components/schemas/address"
        email:
          $ref: "#/components/schemas/email"
        name:
          $ref: "#/components/schemas/name"
        phone:
          $ref: "#/components/schemas/phone"
        meta:
          $ref: "#/components/schemas/meta"
        created_datetime:
          type: string
          format: date-time
    charge_status:
      type: string
      description: The status of the charge.
      example: succeeded
      enum:
        - succeeded
        - pending
        - failed
        - voided
    amount:
      type: number
      format: decimal
      description: The payment amount in decimals.
      example: 12.34
      minimum: 0.01
    fees:
      type: array
      description: Fees charged on payment amount
      items:
        type: object
        properties:
          type:
            type: string
            description: "The specific type of fee. i.e., \"vat\", \"app\", \"merchant\", \"stamp_duty\"."
            example: vat
          amount:
            type: number
            format: decimal
            description: The fee amount in decimal format.
            example: 12.3
