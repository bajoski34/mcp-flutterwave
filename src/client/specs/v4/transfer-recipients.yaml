    payment_method_id:
      type: string
      description: ID of the payment method.
      example: pmd_WRq7L4TM8p
    base_payment_method:
      required:
        - id
        - type
      properties:
        id:
          $ref: '#/components/schemas/payment_method_id'
        type:
          type: string
          description: The type of the payment method.
          example: card
        customer_id:
          description: ID of the customer.
          type: string
          example: cus_3XarBILKQS
        meta:
          $ref: '#/components/schemas/meta'
        device_fingerprint:
          description: The customer's device fingerprint.
          type: string
          example: 62wd23423rq324323qew1
        client_ip:
          description: The customer's device IP.
          type: string
          example: 154.123.220.1
        created_datetime:
          type: string
          format: date-time
          description: The date and time when the virtual account was created.
          example: '2024-12-03T13:54:21.546559974Z'
    card_network:
      type: string
      description: The card network.
      example: MASTERCARD
      enum:
        - MASTERCARD
        - VISA
        - AMERICAN EXPRESS
        - DISCOVER
        - VERVE
        - AFRIGO
        - UNKNOWN
    credential_on_file:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Indicates whether the recurring card charge with Credential-on-File (COF) is enabled.
          example: true
        agreement_id:
          type: string
          description: A unique reference generated by Flutterwave during the initial Customer Initiated Transaction (CIT).
          example: Agreement00w02W1
        recurring_amount_variability:
          type: string
          description: This indicates whether the amount charged for subsequent payments remains the same, or differs.
          example: VARIABLE
          enum:
            - VARIABLE
        agreement_type:
          type: string
          definition: This indicates the type of charge agreement with Flutterwave.
          example: UNSCHEDULED
          enum:
            - UNSCHEDULED
        trace_id:
          type: string
          description: A reference generated by the card scheme during the initial Customer Initiated Transaction (CIT).
          example: '123456789'
    card:
      type: object
      required:
        - expiry_month
        - expiry_year
        - first6
        - last4
        - network
      properties:
        expiry_month:
          type: integer
          description: Expiry month of the card.
          example: '09'
        expiry_year:
          type: integer
          description: Expiry year of the card.
          example: '32'
        first6:
          type: string
          description: Bank identification number (BIN) of the card.
          minLength: 6
          maxLength: 6
          example: '123412'
        last4:
          type: string
          description: The last four digits of the card number.
          minLength: 4
          maxLength: 4
          example: '1234'
        network:
          $ref: '#/components/schemas/card_network'
        billing_address:
          $ref: '#/components/schemas/address'
        cof:
          $ref: '#/components/schemas/credential_on_file'
        card_holder_name:
          type: string
          description: Name on the card
          example: Alex James
    card_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
        - card
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: card
          readOnly: true
        card:
          $ref: '#/components/schemas/card'
    bank_account:
      type: object
    bank_account_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: bank_account
          readOnly: true
        bank_account:
          $ref: '#/components/schemas/bank_account'
    mobile_money:
      type: object
      required:
        - network
        - phone_number
        - country_code
      properties:
        network:
          type: string
          description: The mobile network of the customer's phone number.
          example: MTN
        country_code:
          type: string
          description: The dialling country code e.g. 233 for GH.
          example: '233'
        phone_number:
          type: string
          description: The phone number of customer.
          example: '9012345678'
        qr_code:
          type: string
    mobile_money_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
        - mobile_money
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: mobile_money
          readOnly: true
        mobile_money:
          $ref: '#/components/schemas/mobile_money'
    opay:
      type: object
    opay_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: opay
          readOnly: true
        opay:
          $ref: '#/components/schemas/opay'
    applepay:
      type: object
      properties:
        card_holder_name:
          type: string
          description: The cardholder name.
          example: Yohan Blake
    applepay_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: applepay
          readOnly: true
        applepay:
          $ref: '#/components/schemas/applepay'
    googlepay:
      type: object
      properties:
        card_holder_name:
          type: string
          description: The cardholder name.
          example: Yohan Blake
    googlepay_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: googlepay
          readOnly: true
        googlepay:
          $ref: '#/components/schemas/googlepay'
    ussd:
      type: object
      properties:
        account_bank:
          type: string
          description: The bank code of the USSD string to generate.
          example: '050'
    ussd_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: ussd
          readOnly: true
        ussd:
          $ref: '#/components/schemas/ussd'
    pwbt_type:
      type: string
      description: The type of virtual account.
      example: static
      enum:
        - static
        - dynamic
    pwbt:
      type: object
      required:
        - account_type
      properties:
        account_expires_in:
          type: integer
          description: The expiry time of the virtual account.
          example: 360
          maximum: 432000
        account_display_name:
          type: string
          description: The name that is shown to the customer when the account is resolved to a name.
          example: Alex James
          minLength: 3
          maxLength: 256
        account_type:
          $ref: '#/components/schemas/pwbt_type'
        originator_bank_name:
          type: string
          description: The sender's Bank name
          example: Mock Bank
        originator_account_number:
          type: string
          description: The Sender's masked account number
          example: 002*******78
        originator_name:
          type: string
          description: The sender's name
          example: Jane Doe
        virtual_account_number:
          type: string
          description: The virtual account number that was credited.
          example: '0067100155'
    pwbt_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
        - bank_transfer
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: bank_transfer
          readOnly: true
        bank_transfer:
          $ref: '#/components/schemas/pwbt'
    paypal:
      type: object
    paypal_payment_method:
      allOf:
        - $ref: '#/components/schemas/base_payment_method'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: paypal
          readOnly: true
        paypal:
          $ref: '#/components/schemas/paypal'
    payment_method:
      oneOf:
        - $ref: '#/components/schemas/card_payment_method'
        - $ref: '#/components/schemas/bank_account_payment_method'
        - $ref: '#/components/schemas/mobile_money_payment_method'
        - $ref: '#/components/schemas/opay_payment_method'
        - $ref: '#/components/schemas/applepay_payment_method'
        - $ref: '#/components/schemas/googlepay_payment_method'
        - $ref: '#/components/schemas/ussd_payment_method'
        - $ref: '#/components/schemas/pwbt_payment_method'
        - $ref: '#/components/schemas/paypal_payment_method'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/card_payment_method'
          bank_account: '#/components/schemas/bank_account_payment_method'
          mobile_money: '#/components/schemas/mobile_money_payment_method'
          opay: '#/components/schemas/opay_payment_method'
          applepay: '#/components/schemas/applepay_payment_method'
          googlepay: '#/components/schemas/googlepay_payment_method'
          ussd: '#/components/schemas/ussd_payment_method'
          bank_transfer: '#/components/schemas/pwbt_payment_method'
          paypal: '#/components/schemas/paypal_payment_method'
    reference:
      type: string
      pattern: ^[a-zA-Z0-9\-]+$
      minLength: 6
      maxLength: 42
      description: A custom identifier to track the transaction, This must be unique across all your transactions.
      x-pattern-message: must be an alphanumeric string
    processor_response:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
          pattern: \d{2}
          x-pattern-message: must be two digits
        message:
          type: string
          description: >-
            A human-readable description of the processor response. For failed transactions, this is the reason provided
            by the processor.
          example: Insufficient funds.
      enum:
        - type: approved
          code: '00'
        - type: refer_to_issuer
          code: '01'
        - type: refer_to_issuer_special_condition
          code: '02'
        - type: invalid_merchant
          code: '03'
        - type: pick_up_card_no_fraud
