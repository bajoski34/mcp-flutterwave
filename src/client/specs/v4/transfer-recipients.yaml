      properties:
        status:
          $ref: '#/components/schemas/status'
        message:
          type: string
        data:
          $ref: '#/components/schemas/recipient'
    refund:
      description: A refund of a previously created charge
      type: object
      properties:
        id:
          description: ID of the refund
          type: string
        amount_refunded:
          allOf:
            - $ref: '#/components/schemas/amount'
          description: Amount of the refund
        meta:
          $ref: '#/components/schemas/meta'
        reason:
          type: string
          enum:
            - duplicate
            - fraudulent
            - requested_by_customer
            - expired_uncaptured_charge
          description: Reason for the refund
          example: requested_by_customer
        status:
          type: string
          enum:
            - pending
            - requires_action
            - succeeded
            - failed
            - cancelled
            - completed
            - new
          description: Status of the refund
          example: new
        charge_id:
          type: string
          description: ID of the charge tied to this refund
          example: chg_VnUihmASmF
        created_datetime:
          type: string
    base_webhook_payload:
      type: object
      description: Base webhook payload schema
      required:
        - data
        - type
        - timestamp
        - webhook_id
      properties:
        webhook_id:
          type: string
          description: Webhook event identifier
        timestamp:
          type: integer
          format: int64
          description: Webhook event timestamp
        type:
          type: string
          description: Webhook event type
          enum:
            - charge.completed
            - transfer.disburse
            - transfer.reversal
            - order.authorization
        data:
          type: object
    charge_completed_webhook_payload:
      type: object
      description: Charge completion webhook payload
      allOf:
        - $ref: '#/components/schemas/base_webhook_payload'
        - type: object
          properties:
            type:
              type: string
              readOnly: true
              default: charge.completed
            data:
              type: object
              properties:
                id:
                  type: string
                  description: ID of the charge
                amount:
                  $ref: '#/components/schemas/amount'
                currency:
                  $ref: '#/components/schemas/currency'
                customer:
                  $ref: '#/components/schemas/customer'
                description:
                  type: string
                  description: Description of the charge.
                meta:
                  $ref: '#/components/schemas/meta'
                payment_method:
                  $ref: '#/components/schemas/payment_method'
                redirect_url:
                  type: string
                  description: Specifies the URL to redirect to.
                reference:
                  $ref: '#/components/schemas/reference'
                status:
                  type: string
                  description: The status of the charge
                processor_response:
                  $ref: '#/components/schemas/processor_response'
                created_datetime:
                  type: string
                  format: date-time
    base_transfer_webhook:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the transfer
        type:
          type: string
          default: bank
          readOnly: true
        source_currency:
          allOf:
            - $ref: '#/components/schemas/currency'
          description: The currency in which the transfer was debited.
          example: NGN
        destination_currency:
          allOf:
            - $ref: '#/components/schemas/currency'
          description: The currency in which the amount will be credited to the recipient.
          example: EUR
        amount:
          description: Amount to be sent to the recipient. This is a positive integer in the smallest currency unit
          type: integer
          format: decimal
          minimum: 1
          example: 3000.44
        reference:
          $ref: '#/components/schemas/reference'
        proof:
          type: string
          description: Transfer proof
        status:
          description: The status of the transfer.
          type: string
          enum:
            - FAILED
            - SUCCESSFUL
        disburse_datetime:
          type: string
          format: date-time
        bank:
          type: object
          properties:
            account_number:
              description: recipient account number
              type: string
              example: '0690000031'
              minLength: 10
            code:
              description: recipient bank code
              type: string
              example: '044'
              minLength: 2
              maxLength: 10
            branch:
              description: recipient bank branch
              type: string
              example: 1812051EPC
              minLength: 2
            name:
              description: recipient bank name
              type: string
              example: Commonwealth Bank of Australia
            routing_number:
              description: recipient bank routing number
              type: string
              example: '110000'
              minLength: 2
            swift_code:
              description: recipient bank swift code
              type: string
              example: CTBAAU2S
              minLength: 2
        mobile_money:
          type: object
          properties:
            network:
              description: recipient network
              type: string
            country:
              description: recipient country
              type: string
              minLength: 2
              maxLength: 25
              pattern: ^[a-zA-Z0-9]*$
              example: MTN
            msisdn:
              description: recipient phone number
              type: string
              minLength: 6
              maxLength: 25
              pattern: ^[a-zA-Z0-9]*$
              example: '251911234567'
        wallet:
          type: object
          properties:
            provider:
              type: string
              enum:
                - flutterwave
              description: Specifies the payment or service provider. Currently, only "flutterwave" is supported
            identifier:
              description: A unique identifier assigned to the merchant by the payment or service provider.
              type: string
              example: '00118468'
              minLength: 7
              maxLength: 25
              pattern: ^[a-zA-Z0-9]*$
        cash_pickup:
          type: object
          properties:
            network:
              description: cashpickup network
              type: string
        fee:
          type: object
          properties:
            currency:
              allOf:
                - $ref: '#/components/schemas/currency'
              description: The currency in which the fee is charged.
            value:
              type: number
              description: The amount charged as a fee for the transfer.
              format: double
              minimum: 0
              example: 10.35
        debit_information:
          type: object
          properties:
            currency:
              allOf:
                - $ref: '#/components/schemas/currency'
              description: The currency in which the fees and charges are applied for the transfer.
            actual_debit_amount:
              type: number
              description: The exact amount deducted for the transfer, including applicable fees.
              format: decimal
              minimum: 0
              example: 100.35
            rate_used:
              type: number
              description: The exchange rate applied to calculate the transfer amount.
              format: decimal
              minimum: 0
              example: 100.35
            vat:
              type: number
              description: The Value-Added Tax (VAT) amount charged for the transfer.
              format: decimal
              minimum: 0
              example: 100.35
        payment_information:
          type: object
          properties:
            proof:
              type: string
              description: Session ID
              example: '11000224070317345400001414441712312381'
        provider_response:
          $ref: '#/components/schemas/provider_response'
        meta:
          $ref: '#/components/schemas/meta'
    transfer_disburse_webhook_payload:
      type: object
      description: Disbursed Transfer webhook payload
      allOf:
        - $ref: '#/components/schemas/base_webhook_payload'
        - type: object
          properties:
            type:
              type: string
              readOnly: true
              default: transfer.disburse
            data:
              allOf:
                - $ref: '#/components/schemas/base_transfer_webhook'
    transfer_reversal_webhook_payload:
      type: object
      description: Transfer Reversal webhook payload
      allOf:
        - $ref: '#/components/schemas/base_webhook_payload'
        - type: object
          properties:
            type:
              type: string
              readOnly: true
              default: transfer.reversal
            data:
              allOf:
                - $ref: '#/components/schemas/base_transfer_webhook'
                - type: object
                  properties:
                    reversal:
                      type: object
                      properties:
                        reversal_datetime:
                          type: string
                          format: date-time
                        initial_status:
                          type: string
                          example: SUCCESSFUL
                        reconciliation_status:
                          type: string
                          example: REVERSED
                        reconciliation_type:
                          type: string
                          enum:
                            - D
                            - C
    order_authorization_webhook_payload:
      type: object
      description: Order authorization webhook payload
      allOf:
        - $ref: '#/components/schemas/base_webhook_payload'
        - type: object
          properties:
            type:
              type: string
              readOnly: true
              default: order.authorization
            data:
              type: object
              properties:
                id:
                  type: string
                  description: ID of the order
                amount:
                  $ref: '#/components/schemas/amount'
                currency:
                  $ref: '#/components/schemas/currency'
                customer:
                  $ref: '#/components/schemas/customer'
                description:
                  type: string
                  description: Description of the order.
                meta:
                  $ref: '#/components/schemas/meta'
                payment_method:
                  $ref: '#/components/schemas/payment_method'
                redirect_url:
                  type: string
                  description: Specifies the URL to redirect to.
                reference:
                  $ref: '#/components/schemas/reference'
                status:
                  type: string
                  description: The status of the order
                processor_response:
                  $ref: '#/components/schemas/processor_response'
                created_datetime:
                  type: string
                  format: date-time
    refund_completed_webhook_payload:
      type: object
      description: Refund completion webhook payload
      allOf:
        - $ref: '#/components/schemas/base_webhook_payload'
        - type: object
          properties:
            type:
              type: string
              readOnly: true
              default: refund.completed
            data:
              $ref: '#/components/schemas/refund'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
