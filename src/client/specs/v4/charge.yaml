          ussd: "#/components/schemas/ussd_payment_method"
          bank_transfer: "#/components/schemas/pwbt_payment_method"
          paypal: "#/components/schemas/paypal_payment_method"
    reference:
      type: string
      pattern: "^[a-zA-Z0-9\\-]+$"
      minLength: 6
      maxLength: 42
      description: "A custom identifier to track the transaction, This must be unique across all your transactions."
      x-pattern-message: must be an alphanumeric string
    processor_response:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
          pattern: "\\d{2}"
          x-pattern-message: must be two digits
      enum:
        -
          type: approved
          code: "00"
        -
          type: refer_to_issuer
          code: "01"
        -
          type: refer_to_issuer_special_condition
          code: "02"
        -
          type: invalid_merchant
          code: "03"
        -
          type: pick_up_card_no_fraud
          code: "04"
        -
          type: do_not_honor
          code: "05"
        -
          type: error
          code: "06"
        -
          type: pick_up_card_fraud
          code: "07"
        -
          type: partial_approval
          code: "10"
        -
          type: invalid_transaction
          code: "12"
        -
          type: invalid_amount
          code: "13"
        -
          type: invalid_account_number
          code: "14"
        -
          type: no_such_issuer
          code: "15"
        -
          type: reenter_transaction
          code: "19"
        -
          type: no_action_taken
          code: "21"
        -
          type: unable_to_locate_record_in_file
          code: "25"
        -
          type: file_temporarily_not_available
          code: "28"
        -
          type: lost_card_pick_up
          code: "41"
        -
          type: stolen_card_pick_up
          code: "43"
        -
          type: insufficient_funds
          code: "51"
        -
          type: no_checking_account
          code: "52"
        -
          type: no_savings_account
          code: "53"
        -
          type: expired_card
          code: "54"
        -
          type: incorrect_pin
          code: "55"
        -
          type: transaction_not_permitted_card
          code: "57"
        -
          type: transaction_not_permitted_terminal
          code: "58"
        -
          type: suspected_fraud
          code: "59"
        -
          type: exceeds_approval_amount_limit
          code: "61"
        -
          type: invalid_restricted_service_code
          code: "62"
        -
          type: security_violation
          code: "63"
        -
          type: transaction_does_not_fulfill_aml_req
          code: "64"
        -
          type: exceeds_withdrawal_limit
          code: "65"
        -
          type: pin_data_required
          code: "70"
        -
          type: pin_entry_tries_exceeded
          code: "75"
        -
          type: unsolicited_reversal
          code: "76"
        -
          type: blocked_first_use
          code: "78"
        -
          type: already_reversed
          code: "79"
        -
          type: negative_cvv_result
          code: "82"
        -
          type: no_reason_to_decline
          code: "85"
        -
          type: cannot_verify_pin
          code: "86"
        -
          type: issuer_unavailable
          code: "91"
        -
          type: unable_to_route_transaction
          code: "92"
        -
          type: cannot_complete_violation_of_law
          code: "93"
        -
          type: system_error
          code: "96"
        -
          type: invalid_cvv
          code: "97"
    charge:
      type: object
      properties:
        id:
          description: ID of the charge.
          type: string
          example: chg_nONgeAGY97
        amount:
          allOf:
            -
              $ref: "#/components/schemas/amount"
          description: The payment amount in decimals.
        fees:
          allOf:
            -
              $ref: "#/components/schemas/fees"
        billing_details:
          type: object
          description: "The customer's billing information."
          properties:
            email:
              $ref: "#/components/schemas/email"
            name:
              $ref: "#/components/schemas/name"
            phone:
              $ref: "#/components/schemas/phone"
        currency:
          $ref: "#/components/schemas/currency"
        customer_id:
          description: ID of the customer.
          type: string
          example: cus_3XarBILKQS
        description:
          description: "The charge's description."
          type: string
        disputed:
          description: Boolean indicating if the charge was disputed.
          type: boolean
          example: false
        settled:
          description: Boolean indicating if the transaction has been settled.
          type: boolean
          example: false
        settlement_id:
          description: Id for the settlement the transaction belongs to.
          type: array
          items:
            type: string
        meta:
          $ref: "#/components/schemas/meta"
        next_action:
          $ref: "#/components/schemas/next_action"
        payment_method_details:
          $ref: "#/components/schemas/payment_method"
        redirect_url:
          type: string
          description: Specifies the URL to redirect to.
          example: "https://www.google.com"
        refunded:
          description: Boolean indicating if the transaction has been refunded.
          type: boolean
          example: false
        reference:
          $ref: "#/components/schemas/reference"
        status:
          $ref: "#/components/schemas/charge_status"
        processor_response:
          $ref: "#/components/schemas/processor_response"
        created_datetime:
          type: string
          format: date-time
          description: Timestamp for when the transaction was created.
        descriptor:
          description: The name of the processor
          type: string
    otp:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: "^\\d{4,8}$"
          description: One-time password(OTP) sent by the Bank.
          x-pattern-message: must be a numeric value between 4 and 8 digits long.
    otp_authorization_in:
      type: object
      description: OTP authorization object.
      required:
        - type
      properties:
        type:
          type: string
          default: otp
          readOnly: true
        otp:
          $ref: "#/components/schemas/otp"
    nonce:
      type: string
      pattern: "^[a-zA-Z0-9]+$"
      minLength: 12
      maxLength: 12
      description: A single-use 12 character alphanumeric string for field-level encryption.
      x-pattern-message: must be an alphanumeric string of length 12
    encrypted_pin:
      type: object
      description: PIN authorization object.
      required:
        - encrypted_pin
        - nonce
      properties:
        nonce:
          $ref: "#/components/schemas/nonce"
        encrypted_pin:
          type: string
    encrypted_pin_authorization_in:
      type: object
      description: PIN authorization object.
      required:
        - type
      properties:
        type:
          type: string
          default: pin
          readOnly: true
        pin:
          $ref: "#/components/schemas/encrypted_pin"
    external_3ds:
      type: object
      required:
        - eci
        - authentication_token
        - transaction_id
        - version
        - transaction_status
        - status_reason_code
        - amount
        - time
      properties:
        eci:
          type: string
          description: "Electronic Commerce Indicator from the issuer's Access Control Server (ACS), showing the outcome of the payer's authentication attempt."
          example: "03"
        time:
          type: string
          description: "The time of the payer's authentication in UTC."
          example: "2024-04-11T08:08:43.974Z"
        authentication_token:
          type: string
          description: Base64 encoded value generated by the card issuer.
          example: zPkn+YYYYYY53434HFHDss=
        transaction_id:
          type: string
          description: The unique transaction identifier from the Access Control Server (ACS).
          example: "1F3Uciah9cnh4mrnPPtyT_RA_test"
        version:
          type: string
          description: EMV 3D Secure protocol.
          example: "2.1.0"
        transaction_status:
          type: string
          description: The status of the external authorization attempt.
          example: Y
          enum:
            - Y
            - N
            - U
            - A
            - R
        status_reason_code:
          type: string
        amount:
          $ref: "#/components/schemas/amount"
    external_3ds_authorization_in:
      type: object
      description: External 3DS authorization object.
      required:
        - type
        - external_3ds
      properties:
        type:
          type: string
          default: external_3ds
          readOnly: true
        external_3ds:
          $ref: "#/components/schemas/external_3ds"
    avs:
      type: object
      required:
        - address
      properties:
        address:
          $ref: "#/components/schemas/address"
    avs_authorization_in:
      type: object
      description: AVS authorization object.
      required:
        - type
      properties:
        type:
          type: string
          default: avs
          readOnly: true
        avs:
          $ref: "#/components/schemas/avs"
    authorization_in:
      oneOf:
        -
          $ref: "#/components/schemas/otp_authorization_in"
        -
          $ref: "#/components/schemas/encrypted_pin_authorization_in"
        -
          $ref: "#/components/schemas/external_3ds_authorization_in"
        -
          $ref: "#/components/schemas/avs_authorization_in"
      discriminator:
        propertyName: type
        mapping:
          otp: "#/components/schemas/otp_authorization_in"
          pin: "#/components/schemas/encrypted_pin_authorization_in"
          external_3ds: "#/components/schemas/external_3ds_authorization_in"
          avs: "#/components/schemas/avs_authorization_in"
    merchant_vat_amount:
      type: number
      format: decimal
      example: 22.7
    charge_in:
      type: object
      required:
        - amount
        - currency
        - customer_id
        - payment_method_id
        - reference
      properties:
        amount:
          allOf:
            -
              $ref: "#/components/schemas/amount"
          description: The payment amount in decimals.
        currency:
          $ref: "#/components/schemas/currency"
        reference:
          $ref: "#/components/schemas/reference"
        customer_id:
          $ref: "#/components/schemas/customer_id"
        meta:
          $ref: "#/components/schemas/meta"
        payment_method_id:
          $ref: "#/components/schemas/payment_method_id"
        redirect_url:
          type: string
          description: Specifies the URL to redirect to.
          example: "https://www.google.com"
        authorization:
          $ref: "#/components/schemas/authorization_in"
        recurring:
          type: boolean
          description: Specify true for a recurring charge. Recurring charges bypass authorization flows and always return a terminal status of successful or failed.
          default: false
        order_id:
          type: string
          description: ID of the order. This is only used for preauth captures.
          example: ord_3XarBILKQS
        merchant_vat_amount:
          $ref: "#/components/schemas/merchant_vat_amount"
    provider_response:
      type: object
      required:
        - type
        - code
      description: "Represents payout error codes. The `type` and `code` fields are separate enums where:\n- `type` indicates the nature of the error.\n- `code` provides the specific error code associated with the error type.\n- `message` explains the meaning of the `type-code` pair\n"
      properties:
        message:
          type: string
          description: The processor message for the transfer.
          example: "DISBURSE FAILED: Insufficient wallet balance"
        type:
          type: string
          description: "The type of the payout error, representing the specific error scenario.\n"
          enum:
            - transfer_amount_exceeds_limit
            - transfer_amount_below_limit
            - monthly_transfer_limit_exceeded
            - daily_transfer_limit_exceeded
            - transfer_limit_not_set_for_currency
            - payout_creation_failed
            - insufficient_balance
            - service_unavailable
            - transfer_failed
            - pricing_not_set
            - currency_conversion_not_set
            - rejected_recipient_merchant
            - invalid_bank_code
            - unable_to_determine_country
            - invalid_wallet_currency
        code:
          type: string
          description: "The unique code associated with the error type. This code follows a pattern of four digits.\n"
          pattern: "\\d{4}"
    refund:
      description: A refund of a previously created charge
      type: object
      properties:
        id:
          description: ID of the refund
          type: string
        amount_refunded:
          allOf:
            -
              $ref: "#/components/schemas/amount"
          description: Amount of the refund
        meta:
          $ref: "#/components/schemas/meta"
        reason:
          type: string
          enum:
            - duplicate
            - fraudulent
            - requested_by_customer
            - expired_uncaptured_charge
          description: Reason for the refund
          example: requested_by_customer
        status:
          type: string
          enum:
            - pending
            - requires_action
            - succeeded
            - failed
            - cancelled
            - completed
            - new
          description: Status of the refund
          example: new
        charge_id:
          type: string
          description: ID of the charge tied to this refund
          example: chg_VnUihmASmF
        created_datetime:
          type: string
    base_webhook_payload:
      type: object
      description: Base webhook payload schema
      required:
        - data
        - type
        - timestamp
        - webhook_id
      properties:
        webhook_id:
          type: string
          description: Webhook event identifier
        timestamp:
          type: integer
          format: int64
          description: Webhook event timestamp
        type:
          type: string
          description: Webhook event type
          enum:
            - charge.completed
            - transfer.disburse
            - transfer.reversal
            - order.authorization
        data:
          type: object
    charge_completed_webhook_payload:
      type: object
      description: Charge completion webhook payload
      allOf:
        -
          $ref: "#/components/schemas/base_webhook_payload"
        -
          type: object
          properties:
          type:
          type: string
          readOnly: true
          default: charge.completed
          data:
          type: object
          properties:
          id:
          type: string
          description: ID of the charge
          amount:
          $ref: "#/components/schemas/amount"
          currency:
          $ref: "#/components/schemas/currency"
          customer:
          $ref: "#/components/schemas/customer"
          description:
          type: string
          description: Description of the charge.
          meta:
          $ref: "#/components/schemas/meta"
          payment_method:
          $ref: "#/components/schemas/payment_method"
          redirect_url:
          type: string
          description: Specifies the URL to redirect to.
          reference:
          $ref: "#/components/schemas/reference"
          status:
          type: string
          description: The status of the charge
          processor_response:
          $ref: "#/components/schemas/processor_response"
          created_datetime:
          type: string
          format: date-time
    base_transfer_webhook:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the transfer
        type:
          type: string
          default: bank
          readOnly: true
        source_currency:
          allOf:
            -
              $ref: "#/components/schemas/currency"
          description: The currency in which the transfer was debited.
          example: NGN
        destination_currency:
          allOf:
            -
              $ref: "#/components/schemas/currency"
          description: The currency in which the amount will be credited to the recipient.
          example: EUR
        amount:
          description: Amount to be sent to the recipient. This is a positive integer in the smallest currency unit
          type: integer
          format: decimal
          minimum: 1
          example: 3000.44
        reference:
          $ref: "#/components/schemas/reference"
        proof:
          type: string
          description: Transfer proof
        status:
          description: The status of the transfer.
          type: string
          enum:
            - FAILED
            - SUCCESSFUL
        disburse_datetime:
          type: string
          format: date-time
        bank:
          type: object
          properties:
            account_number:
              description: recipient account number
              type: string
              example: "0690000031"
              minLength: 10
            code:
              description: recipient bank code
              type: string
              example: "044"
              minLength: 2
              maxLength: 10
            branch:
              description: recipient bank branch
              type: string
              example: "1812051EPC"
              minLength: 2
            name:
              description: recipient bank name
              type: string
              example: Commonwealth Bank of Australia
            routing_number:
              description: recipient bank routing number
              type: string
              example: "110000"
              minLength: 2
            swift_code:
              description: recipient bank swift code
              type: string
              example: CTBAAU2S
              minLength: 2
        mobile_money:
          type: object
          properties:
            network:
              description: recipient network
              type: string
            country:
              description: recipient country
              type: string
              minLength: 2
              maxLength: 25
              pattern: "^[a-zA-Z0-9]*$"
              example: MTN
            msisdn:
              description: recipient phone number
              type: string
              minLength: 6
              maxLength: 25
              pattern: "^[a-zA-Z0-9]*$"
              example: "251911234567"
        wallet:
          type: object
          properties:
            provider:
              type: string
              enum:
                - flutterwave
              description: "Specifies the payment or service provider. Currently, only \"flutterwave\" is supported"
            identifier:
              description: A unique identifier assigned to the merchant by the payment or service provider.
              type: string
              example: "00118468"
              minLength: 7
              maxLength: 25
              pattern: "^[a-zA-Z0-9]*$"
        cash_pickup:
          type: object
          properties:
            network:
              description: cashpickup network
              type: string
        fee:
          type: object
          properties:
            currency:
              allOf:
                -
                  $ref: "#/components/schemas/currency"
              description: The currency in which the fee is charged.
            value:
              type: number
              description: The amount charged as a fee for the transfer.
              format: double
              minimum: 0
              example: 10.35
        debit_information:
          type: object
          properties:
            currency:
              allOf:
                -
                  $ref: "#/components/schemas/currency"
              description: The currency in which the fees and charges are applied for the transfer.
            actual_debit_amount:
              type: number
              description: "The exact amount deducted for the transfer, including applicable fees."
              format: decimal
              minimum: 0
              example: 100.35
            rate_used:
              type: number
              description: The exchange rate applied to calculate the transfer amount.
              format: decimal
              minimum: 0
              example: 100.35
            vat:
              type: number
              description: The Value-Added Tax (VAT) amount charged for the transfer.
              format: decimal
              minimum: 0
              example: 100.35
        payment_information:
          type: object
          properties:
            proof:
              type: string
              description: Session ID
              example: "11000224070317345400001414441712312381"
        provider_response:
          $ref: "#/components/schemas/provider_response"
        meta:
          $ref: "#/components/schemas/meta"
    transfer_disburse_webhook_payload:
      type: object
      description: Disbursed Transfer webhook payload
      allOf:
        -
          $ref: "#/components/schemas/base_webhook_payload"
        -
          type: object
          properties:
          type:
          type: string
          readOnly: true
          default: transfer.disburse
          data:
          allOf:
