          code: '91'
        - type: unable_to_route_transaction
          code: '92'
        - type: cannot_complete_violation_of_law
          code: '93'
        - type: system_error
          code: '96'
        - type: invalid_cvv
          code: '97'
    provider_response:
      type: object
      required:
        - type
        - code
      description: |
        Represents payout error codes. The `type` and `code` fields are separate enums where:
        - `type` indicates the nature of the error.
        - `code` provides the specific error code associated with the error type.
        - `message` explains the meaning of the `type-code` pair
      properties:
        message:
          type: string
          description: The processor message for the transfer.
          example: 'DISBURSE FAILED: Insufficient wallet balance'
        type:
          type: string
          description: |
            The type of the payout error, representing the specific error scenario.
          enum:
            - transfer_amount_exceeds_limit
            - transfer_amount_below_limit
            - monthly_transfer_limit_exceeded
            - daily_transfer_limit_exceeded
            - transfer_limit_not_set_for_currency
            - payout_creation_failed
            - insufficient_balance
            - service_unavailable
            - transfer_failed
            - pricing_not_set
            - currency_conversion_not_set
            - rejected_recipient_merchant
            - invalid_bank_code
            - unable_to_determine_country
            - invalid_wallet_currency
        code:
          type: string
          description: |
            The unique code associated with the error type. This code follows a pattern of four digits.
          pattern: \d{4}
