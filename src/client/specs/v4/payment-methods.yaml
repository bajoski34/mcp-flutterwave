          type:
          type: string
          readOnly: true
          default: order.authorization
          data:
          type: object
          properties:
          id:
          type: string
          description: ID of the order
          amount:
          $ref: "#/components/schemas/amount"
          currency:
          $ref: "#/components/schemas/currency"
          customer:
          $ref: "#/components/schemas/customer"
          description:
          type: string
          description: Description of the order.
          meta:
          $ref: "#/components/schemas/meta"
          payment_method:
          $ref: "#/components/schemas/payment_method"
          redirect_url:
          type: string
          description: Specifies the URL to redirect to.
          reference:
          $ref: "#/components/schemas/reference"
          status:
          type: string
          description: The status of the order
          processor_response:
          $ref: "#/components/schemas/processor_response"
          created_datetime:
          type: string
          format: date-time
    refund_completed_webhook_payload:
      type: object
      description: Refund completion webhook payload
      allOf:
        -
          $ref: "#/components/schemas/base_webhook_payload"
        -
          type: object
          properties:
          type:
          type: string
          readOnly: true
          default: refund.completed
          data:
          $ref: "#/components/schemas/refund"
