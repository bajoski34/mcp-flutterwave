    nonce:
      type: string
      pattern: "^[a-zA-Z0-9]+$"
      minLength: 12
      maxLength: 12
      description: A single-use 12 character alphanumeric string for field-level encryption.
      x-pattern-message: must be an alphanumeric string of length 12
    base_payment_method_in:
      properties:
        type:
          type: string
          description: The type of the payment method.
          example: card
        customer_id:
          type: string
          description: ID of the customer.
          example: cus_3XarBILKQS
        meta:
          $ref: "#/components/schemas/meta"
    credential_on_file_in:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Set to true to enable recurring card charge with Credential-on-File (COF).
          example: true
        agreement_id:
          type: string
          description: A unique reference generated by Flutterwave during the initial Customer Initiated Transaction (CIT).
          example: Agreement00w02W1
        trace_id:
          type: string
          description: A reference generated by the card scheme during the initial Customer Initiated Transaction (CIT).
          example: "123456789"
    encrypted_card_in:
      type: object
      required:
        - encrypted_expiry_month
        - encrypted_expiry_year
        - encrypted_card_number
        - nonce
      properties:
        nonce:
          $ref: "#/components/schemas/nonce"
        encrypted_expiry_month:
          type: string
          description: "Encrypted value of the card's expiry month."
          pattern: ^.+$
          x-pattern-message: value must not be empty
          example: sQpvQEb7GrUCjPuEN/NmHiPl
        encrypted_expiry_year:
          type: string
          description: "Encrypted value of the card's expiry year."
          pattern: ^.+$
          x-pattern-message: value must not be empty
          example: sgHNEDkJ/RmwuWWq/RymToU5
        encrypted_card_number:
          type: string
          description: Encrypted value of the card number.
          pattern: ^.+$
          x-pattern-message: value must not be empty
          example: sAE3hEDaDQ+yLzo4Py+Lx15OZjBGduHu/DcdILh3En0=
        encrypted_cvv:
          type: string
          description: "Encrypted value of the card's security code (CVV/CSC)."
          pattern: ^.+$
          x-pattern-message: value must not be empty
          example: tAUzH7Qjma7diGdi7938F/ESNA==
        billing_address:
          $ref: "#/components/schemas/address"
        cof:
          $ref: "#/components/schemas/credential_on_file_in"
        card_holder_name:
          type: string
          description: Name on the card
          example: Alex James
    card_payment_method_in:
      allOf:
        -
          $ref: "#/components/schemas/base_payment_method_in"
      type: object
      required:
        - type
        - card
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: card
          readOnly: true
        card:
          $ref: "#/components/schemas/encrypted_card_in"
    bank_account_in:
      type: object
    bank_account_payment_method_in:
      allOf:
        -
          $ref: "#/components/schemas/base_payment_method_in"
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: bank_account
          readOnly: true
        bank_account:
          $ref: "#/components/schemas/bank_account_in"
    mobile_money_in:
      type: object
      required:
        - network
        - phone_number
        - country_code
      properties:
        network:
          type: string
          description: "The mobile network of the customer's phone number."
          example: MTN
        country_code:
          type: string
          example: "234"
          pattern: "^[0-9]{1,3}$"
          description: The dialling country code e.g. 233 for GH.
          x-pattern-message: must be a valid 3 digit country code
        phone_number:
          type: string
          example: "8001122334"
          pattern: "^[0-9]{7,10}$"
          x-pattern-message: must be a valid 7 to 10 digit phone number
          description: Unformatted 7-10-digit phone number without the country code.
        use_qr:
          type: boolean
          description: flag that indicates if qr code should be used
    mobile_money_payment_method_in:
      allOf:
        -
          $ref: "#/components/schemas/base_payment_method_in"
      type: object
      required:
        - type
        - mobile_money
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: mobile_money
          readOnly: true
        mobile_money:
          $ref: "#/components/schemas/mobile_money_in"
    opay_in:
      type: object
    opay_payment_method_in:
      allOf:
        -
          $ref: "#/components/schemas/base_payment_method_in"
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: opay
          readOnly: true
        opay:
          $ref: "#/components/schemas/opay_in"
    applepay_in:
      type: object
      properties:
        card_holder_name:
          type: string
          description: The cardholder name.
          example: Yohan Blake
          pattern: "^(?![ ,.'-]*$)[A-Za-z ,.'-]{2,50}$"
          x-pattern-message: "must be between 2 and 50 characters long, cannot be empty, only spaces, or only symbols, and can only contain letters, spaces, commas, periods, apostrophes, or hyphens."
    applepay_payment_method_in:
      allOf:
        -
          $ref: "#/components/schemas/base_payment_method_in"
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: applepay
          readOnly: true
        applepay:
          $ref: "#/components/schemas/applepay_in"
    googlepay_in:
      type: object
      properties:
        card_holder_name:
          type: string
          description: The cardholder name.
          example: Yohan Blake
          pattern: "^(?![ ,.'-]*$)[A-Za-z ,.'-]{2,50}$"
          x-pattern-message: "must be between 2 and 50 characters long, cannot be empty, only spaces, or only symbols, and can only contain letters, spaces, commas, periods, apostrophes, or hyphens."
    googlepay_payment_method_in:
      allOf:
        -
          $ref: "#/components/schemas/base_payment_method_in"
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: googlepay
          readOnly: true
        googlepay:
          $ref: "#/components/schemas/googlepay_in"
    ussd_in:
      type: object
      required:
        - account_bank
      properties:
        account_bank:
          type: string
          pattern: "^\\d{3,}$"
          description: A valid Nigerian bank code consisting of 3 or more digits.
          example: "050"
          x-pattern-message: must be more than 3 digits long and contain only numbers.
    ussd_payment_method_in:
      allOf:
        -
          $ref: "#/components/schemas/base_payment_method_in"
      type: object
      required:
        - type
        - ussd
      properties:
        type:
          type: string
          description: The type of the payment method.
          default: ussd
          readOnly: true
        ussd:
          $ref: "#/components/schemas/ussd_in"
    payment_method_in:
      oneOf:
        -
          $ref: "#/components/schemas/card_payment_method_in"
        -
          $ref: "#/components/schemas/bank_account_payment_method_in"
        -
          $ref: "#/components/schemas/mobile_money_payment_method_in"
        -
          $ref: "#/components/schemas/opay_payment_method_in"
        -
          $ref: "#/components/schemas/applepay_payment_method_in"
        -
          $ref: "#/components/schemas/googlepay_payment_method_in"
        -
          $ref: "#/components/schemas/ussd_payment_method_in"
      discriminator:
        propertyName: type
        mapping:
          card: "#/components/schemas/card_payment_method_in"
          bank_account: "#/components/schemas/bank_account_payment_method_in"
          mobile_money: "#/components/schemas/mobile_money_payment_method_in"
          opay: "#/components/schemas/opay_payment_method_in"
          applepay: "#/components/schemas/applepay_payment_method_in"
          googlepay: "#/components/schemas/googlepay_payment_method_in"
          ussd: "#/components/schemas/ussd_payment_method_in"
    provider_response:
      type: object
      required:
        - type
        - code
      description: "Represents payout error codes. The `type` and `code` fields are separate enums where:\n- `type` indicates the nature of the error.\n- `code` provides the specific error code associated with the error type.\n- `message` explains the meaning of the `type-code` pair\n"
      properties:
        message:
          type: string
          description: The processor message for the transfer.
          example: "DISBURSE FAILED: Insufficient wallet balance"
        type:
          type: string
          description: "The type of the payout error, representing the specific error scenario.\n"
          enum:
            - transfer_amount_exceeds_limit
            - transfer_amount_below_limit
            - monthly_transfer_limit_exceeded
            - daily_transfer_limit_exceeded
            - transfer_limit_not_set_for_currency
            - payout_creation_failed
            - insufficient_balance
            - service_unavailable
            - transfer_failed
            - pricing_not_set
            - currency_conversion_not_set
            - rejected_recipient_merchant
            - invalid_bank_code
            - unable_to_determine_country
            - invalid_wallet_currency
        code:
          type: string
          description: "The unique code associated with the error type. This code follows a pattern of four digits.\n"
          pattern: "\\d{4}"
    refund:
      description: A refund of a previously created charge
      type: object
      properties:
        id:
          description: ID of the refund
          type: string
        amount_refunded:
          allOf:
            -
              $ref: "#/components/schemas/amount"
          description: Amount of the refund
        meta:
          $ref: "#/components/schemas/meta"
        reason:
          type: string
          enum:
            - duplicate
            - fraudulent
            - requested_by_customer
            - expired_uncaptured_charge
          description: Reason for the refund
          example: requested_by_customer
        status:
          type: string
          enum:
            - pending
            - requires_action
            - succeeded
            - failed
            - cancelled
            - completed
            - new
          description: Status of the refund
          example: new
        charge_id:
          type: string
          description: ID of the charge tied to this refund
          example: chg_VnUihmASmF
        created_datetime:
          type: string
    base_webhook_payload:
      type: object
      description: Base webhook payload schema
      required:
        - data
        - type
        - timestamp
        - webhook_id
      properties:
        webhook_id:
          type: string
          description: Webhook event identifier
        timestamp:
          type: integer
          format: int64
          description: Webhook event timestamp
        type:
          type: string
          description: Webhook event type
          enum:
            - charge.completed
            - transfer.disburse
            - transfer.reversal
            - order.authorization
        data:
          type: object
    charge_completed_webhook_payload:
      type: object
      description: Charge completion webhook payload
      allOf:
        -
          $ref: "#/components/schemas/base_webhook_payload"
        -
          type: object
          properties:
          type:
          type: string
          readOnly: true
          default: charge.completed
          data:
          type: object
          properties:
          id:
          type: string
          description: ID of the charge
          amount:
          $ref: "#/components/schemas/amount"
          currency:
          $ref: "#/components/schemas/currency"
          customer:
          $ref: "#/components/schemas/customer"
          description:
          type: string
          description: Description of the charge.
          meta:
          $ref: "#/components/schemas/meta"
          payment_method:
          $ref: "#/components/schemas/payment_method"
          redirect_url:
          type: string
          description: Specifies the URL to redirect to.
          reference:
          $ref: "#/components/schemas/reference"
          status:
          type: string
          description: The status of the charge
          processor_response:
          $ref: "#/components/schemas/processor_response"
          created_datetime:
          type: string
          format: date-time
    base_transfer_webhook:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the transfer
        type:
          type: string
          default: bank
          readOnly: true
        source_currency:
          allOf:
            -
              $ref: "#/components/schemas/currency"
          description: The currency in which the transfer was debited.
          example: NGN
        destination_currency:
          allOf:
            -
              $ref: "#/components/schemas/currency"
          description: The currency in which the amount will be credited to the recipient.
          example: EUR
        amount:
          description: Amount to be sent to the recipient. This is a positive integer in the smallest currency unit
          type: integer
          format: decimal
          minimum: 1
          example: 3000.44
        reference:
          $ref: "#/components/schemas/reference"
        proof:
          type: string
          description: Transfer proof
        status:
          description: The status of the transfer.
          type: string
          enum:
            - FAILED
            - SUCCESSFUL
        disburse_datetime:
          type: string
          format: date-time
        bank:
          type: object
          properties:
            account_number:
              description: recipient account number
              type: string
              example: "0690000031"
              minLength: 10
            code:
              description: recipient bank code
              type: string
              example: "044"
              minLength: 2
              maxLength: 10
            branch:
              description: recipient bank branch
              type: string
              example: "1812051EPC"
              minLength: 2
            name:
              description: recipient bank name
              type: string
              example: Commonwealth Bank of Australia
            routing_number:
              description: recipient bank routing number
              type: string
              example: "110000"
              minLength: 2
            swift_code:
              description: recipient bank swift code
              type: string
              example: CTBAAU2S
              minLength: 2
        mobile_money:
          type: object
          properties:
            network:
              description: recipient network
              type: string
            country:
              description: recipient country
              type: string
              minLength: 2
              maxLength: 25
              pattern: "^[a-zA-Z0-9]*$"
              example: MTN
            msisdn:
              description: recipient phone number
              type: string
              minLength: 6
              maxLength: 25
              pattern: "^[a-zA-Z0-9]*$"
              example: "251911234567"
        wallet:
          type: object
          properties:
            provider:
              type: string
              enum:
                - flutterwave
              description: "Specifies the payment or service provider. Currently, only \"flutterwave\" is supported"
            identifier:
              description: A unique identifier assigned to the merchant by the payment or service provider.
              type: string
              example: "00118468"
              minLength: 7
              maxLength: 25
              pattern: "^[a-zA-Z0-9]*$"
        cash_pickup:
          type: object
          properties:
            network:
              description: cashpickup network
              type: string
        fee:
          type: object
          properties:
            currency:
              allOf:
                -
                  $ref: "#/components/schemas/currency"
              description: The currency in which the fee is charged.
            value:
              type: number
              description: The amount charged as a fee for the transfer.
              format: double
              minimum: 0
              example: 10.35
        debit_information:
          type: object
          properties:
            currency:
              allOf:
                -
                  $ref: "#/components/schemas/currency"
              description: The currency in which the fees and charges are applied for the transfer.
            actual_debit_amount:
              type: number
              description: "The exact amount deducted for the transfer, including applicable fees."
              format: decimal
              minimum: 0
              example: 100.35
            rate_used:
              type: number
              description: The exchange rate applied to calculate the transfer amount.
              format: decimal
              minimum: 0
              example: 100.35
            vat:
              type: number
              description: The Value-Added Tax (VAT) amount charged for the transfer.
              format: decimal
              minimum: 0
              example: 100.35
        payment_information:
          type: object
          properties:
            proof:
              type: string
              description: Session ID
              example: "11000224070317345400001414441712312381"
        provider_response:
          $ref: "#/components/schemas/provider_response"
        meta:
          $ref: "#/components/schemas/meta"
    transfer_disburse_webhook_payload:
      type: object
      description: Disbursed Transfer webhook payload
      allOf:
        -
          $ref: "#/components/schemas/base_webhook_payload"
        -
          type: object
          properties:
          type:
          type: string
          readOnly: true
          default: transfer.disburse
          data:
          allOf:
          -
          $ref: "#/components/schemas/base_transfer_webhook"
    transfer_reversal_webhook_payload:
